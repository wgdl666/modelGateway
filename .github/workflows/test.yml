name: Go tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: model_gateway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: gateway
          RABBITMQ_DEFAULT_PASS: local-test-only
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/model_gateway_test
      TEST_RABBITMQ_URL: amqp://gateway:local-test-only@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: docker build -t model-gateway:test .
