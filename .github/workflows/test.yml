name: Go tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 部署环境（none 仅测试）
        type: choice
        default: none
        options: [none, cn-dev, ppe_exhibition, both]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: model_gateway_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4-alpine
        env:
          RABBITMQ_DEFAULT_USER: gateway
          RABBITMQ_DEFAULT_PASS: local-test-only
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/model_gateway_test
      TEST_RABBITMQ_URL: amqp://gateway:local-test-only@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r deployment_controller/requirements.txt
      - run: go test -race ./... -count=1
        env:
          TEST_LIFECYCLE_PYTHON: python
      - run: python -m unittest discover -s deployment_controller/tests -v
      - run: go vet ./...
      - run: docker build -t model-gateway:test .
      - run: docker build -f deployment_controller/Dockerfile -t model-deployment-controller:test .

  deploy-cn-dev:
    name: Deploy CN Dev (ACK)
    needs: test
    if: github.repository == 'wgdl666/modelGateway' && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["cn-dev","both"]'), inputs.deploy_target)))
    # 公开仓的发布任务需要专用 runner group，避免 PR 任务接触 ACK 发布身份。
    runs-on:
      group: modelgateway-cn-dev-release
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 30
    concurrency:
      group: modelgateway-cn-dev-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy and verify ACK
        run: bash scripts/ci/deploy-ack-dev.sh

  deploy-aws-exhibition:
    name: Deploy US East Exhibition (ECS)
    needs: test
    if: github.repository == 'wgdl666/modelGateway' && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && contains(fromJSON('["ppe_exhibition","both"]'), inputs.deploy_target)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: modelgateway-aws-exhibition-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::054043816891:role/tomirro-model-gateway-github-release
          role-session-name: model-gateway-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: us-east-2
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = 054043816891
      - name: Deploy and verify ECS
        run: bash scripts/ci/deploy-aws-exhibition.sh
